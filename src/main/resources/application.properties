spring.application.name=demo-driveflow

# --- Sandbox database connection ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=driveflow_sandbox_c;encrypt=true;trustServerCertificate=true
spring.datasource.username=driveflow_user
spring.datasource.password=DriveFlow123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# --- Temporarily disable Spring Security's auto-generated login screen ---
# so you can click through pages freely while learning. Re-enable proper
# auth later once the Feedback/Auth module (login) is actually built.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
