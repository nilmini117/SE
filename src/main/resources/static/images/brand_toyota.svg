<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Toyota Iconic Triple Oval Logo -->
  <g fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Horizontal Oval -->
    <ellipse cx="50" cy="50" rx="44" ry="32"/>
    <!-- Inner Vertical Oval -->
    <ellipse cx="50" cy="46" rx="14" ry="24"/>
    <!-- Inner Horizontal Arc / Upper Oval -->
    <ellipse cx="50" cy="34" rx="28" ry="12"/>
  </g>
</svg>
