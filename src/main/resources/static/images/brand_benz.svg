<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Mercedes-Benz Iconic Three-Pointed Star in Ring -->
  <g fill="#0f172a" stroke="#0f172a">
    <!-- Outer ring -->
    <circle cx="50" cy="50" r="42" fill="none" stroke-width="4.5"/>
    <!-- Center 3-point star -->
    <polygon points="50,14 47,50 50,47" fill="#0f172a"/>
    <polygon points="50,14 53,50 50,47" fill="#334155"/>
    <polygon points="19,68 50,52 47,48" fill="#0f172a"/>
    <polygon points="19,68 51,48 50,52" fill="#334155"/>
    <polygon points="81,68 50,52 53,48" fill="#0f172a"/>
    <polygon points="81,68 49,48 50,52" fill="#334155"/>
    <circle cx="50" cy="50" r="4" fill="#0f172a"/>
  </g>
</svg>
