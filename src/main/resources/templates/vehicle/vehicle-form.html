<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vehicle Details')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('vehicles')}"></nav>

<main class="df-main">
    <div style="max-width: 680px; margin: 0 auto 1.5rem;">
        <a th:href="@{/vehicles}" class="btn btn-secondary btn-sm">
            &larr; Back to Vehicles
        </a>
    </div>

    <div class="df-form-card">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;"
            th:text="${vehicle.vehicleId} != null ? 'Edit Vehicle #' + ${vehicle.vehicleId} : 'Register New Vehicle'">
            Register Vehicle
        </h2>
        <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 2rem;">
            Enter vehicle specifications, registration number, color, and current fleet status.
        </p>

        <form th:action="${vehicle.vehicleId} != null ? @{/vehicles/{id}(id=${vehicle.vehicleId})} : @{/vehicles}"
              th:object="${vehicle}" method="post">

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Registration Number</label>
                    <input type="text" th:field="*{regNo}" class="form-control" placeholder="e.g. CA-8942" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Vehicle Make / Model</label>
                    <input type="text" th:field="*{model}" class="form-control" placeholder="e.g. Toyota RAV4 2024" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Vehicle Color</label>
                    <input type="text" th:field="*{color}" class="form-control" placeholder="e.g. Midnight Blue" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Current Mileage (km)</label>
                    <input type="number" th:field="*{mileage}" class="form-control" placeholder="0" min="0" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Operational Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="AVAILABLE">AVAILABLE — Ready for Rent</option>
                        <option value="BOOKED">BOOKED — Currently on Trip</option>
                        <option value="MAINTENANCE">MAINTENANCE — In Workshop</option>
                        <option value="DECOMMISSIONED">DECOMMISSIONED — Retired</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Assigned Branch</label>
                    <select name="branchId" class="form-select">
                        <option value="">-- Select Branch --</option>
                        <option th:each="b : ${branches}"
                                th:value="${b.branchId}"
                                th:selected="${vehicle.branch != null and vehicle.branch.branchId == b.branchId}"
                                th:text="${b.branchName + ' (' + b.city + ')'}">
                            Colombo Central (Colombo)
                        </option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Vehicle</button>
                <a th:href="@{/vehicles}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
