<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vehicle Details')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('vehicles')}"></nav>

<main class="df-main">
    <div style="max-width: 680px; margin: 0 auto 1.5rem;">
        <a th:href="@{/vehicles}" class="btn btn-secondary btn-sm">
            &larr; Back to Vehicles
        </a>
    </div>

    <div class="df-form-card">
        <div th:if="${errorMessage != null or error != null}" 
             style="margin-bottom: 1.5rem; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 0.85rem 1.25rem; border-radius: var(--radius-md); display: flex; align-items: center; gap: 0.75rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${errorMessage != null ? errorMessage : error}">Error message</span>
        </div>

        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;"
            th:text="${vehicle.vehicleId} != null ? 'Edit Vehicle #' + ${vehicle.vehicleId} : 'Register New Vehicle'">
            Register Vehicle
        </h2>
        <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 2rem;">
            Enter vehicle specifications, registration number, color, and current fleet status.
        </p>

        <form th:action="${vehicle.vehicleId} != null ? @{/vehicles/{id}(id=${vehicle.vehicleId})} : @{/vehicles}"
              th:object="${vehicle}" method="post">

            <div class="form-row">
                <!-- Field 1: Mandatory Vehicle Brand Dropdown -->
                <div class="form-group">
                    <label class="form-label" for="brand">Vehicle Brand <span style="color: var(--danger);">*</span></label>
                    <select th:field="*{brand}" id="brand" name="brand" class="form-select" required>
                        <option value="" disabled th:selected="${vehicle.brand == null}">-- Select Vehicle Brand --</option>
                        <option value="Toyota" th:selected="${vehicle.brand == 'Toyota'}">Toyota</option>
                        <option value="Suzuki" th:selected="${vehicle.brand == 'Suzuki'}">Suzuki</option>
                        <option value="Honda" th:selected="${vehicle.brand == 'Honda'}">Honda</option>
                        <option value="Tesla" th:selected="${vehicle.brand == 'Tesla'}">Tesla</option>
                        <option value="Benz" th:selected="${vehicle.brand == 'Benz'}">Benz</option>
                    </select>
                </div>
                <!-- Field 2: Vehicle Make / Model -->
                <div class="form-group">
                    <label class="form-label" for="model">Vehicle Make / Model <span style="color: var(--danger);">*</span></label>
                    <input type="text" th:field="*{model}" id="model" class="form-control" placeholder="e.g. Prius 2024 or RAV4 Prime" required>
                </div>
            </div>

            <div class="form-row">
                <!-- Field 3: Registration Number -->
                <div class="form-group">
                    <label class="form-label" for="regNo">Registration Number <span style="color: var(--danger);">*</span></label>
                    <input type="text" th:field="*{regNo}" id="regNo" class="form-control" placeholder="e.g. WP CA-8942" required>
                </div>
                <!-- Field 4: Vehicle Color -->
                <div class="form-group">
                    <label class="form-label" for="color">Vehicle Color <span style="color: var(--danger);">*</span></label>
                    <input type="text" th:field="*{color}" id="color" class="form-control" placeholder="e.g. Midnight Blue" required>
                </div>
            </div>

            <div class="form-row">
                <!-- Field 5: Current Mileage -->
                <div class="form-group">
                    <label class="form-label" for="mileage">Current Mileage (km) <span style="color: var(--danger);">*</span></label>
                    <input type="number" th:field="*{mileage}" id="mileage" class="form-control" placeholder="0" min="0" required>
                </div>
                <!-- Field 6: Assigned Branch -->
                <div class="form-group">
                    <label class="form-label" for="branchId">Assigned Branch</label>
                    <select name="branchId" id="branchId" class="form-select">
                        <option value="">-- Select Branch --</option>
                        <option th:each="b : ${branches}"
                                th:value="${b.branchId}"
                                th:selected="${vehicle.branch != null and vehicle.branch.branchId == b.branchId}"
                                th:text="${b.branchName + ' (' + b.city + ')'}">
                            Colombo Central (Colombo)
                        </option>
                    </select>
                </div>
            <div class="form-row">
                <!-- Field: Transmission -->
                <div class="form-group">
                    <label class="form-label" for="transmission">Transmission <span style="color: var(--danger);">*</span></label>
                    <input type="text" th:field="*{transmission}" id="transmission" class="form-control" placeholder="e.g. Automatic (CVT) or 6-Speed Manual" required>
                </div>
                <!-- Field: Capacity -->
                <div class="form-group">
                    <label class="form-label" for="capacity">Passenger Capacity <span style="color: var(--danger);">*</span></label>
                    <input type="text" th:field="*{capacity}" id="capacity" class="form-control" placeholder="e.g. 5 Seats" required>
                </div>
            </div>

            <div class="form-row">
                <!-- Field: Engine / Fuel -->
                <div class="form-group">
                    <label class="form-label" for="fuel">Engine / Fuel Type <span style="color: var(--danger);">*</span></label>
                    <input type="text" th:field="*{fuel}" id="fuel" class="form-control" placeholder="e.g. Hybrid 24 km/L or Electric (490 km)" required>
                </div>
                <!-- Field: Daily Rental Rate -->
                <div class="form-group">
                    <label class="form-label" for="dailyRate">Daily Rental Rate (Rs.) <span style="color: var(--danger);">*</span></label>
                    <input type="number" step="0.01" th:field="*{dailyRate}" id="dailyRate" class="form-control" placeholder="12500.00" min="0" required>
                </div>
            </div>

            <div class="form-row">
                <!-- Field 7: Operational Status (Locked to AVAILABLE on Register/Create Mode) -->
                <div class="form-group">
                    <label class="form-label" for="status">Operational Status <span style="color: var(--danger);">*</span></label>
                    
                    <!-- Create/Register Mode: Locked strictly to AVAILABLE only -->
                    <th:block th:if="${vehicle.vehicleId == null}">
                        <select th:field="*{status}" id="status" class="form-select" readonly style="background-color: var(--slate-100); cursor: not-allowed;">
                            <option value="AVAILABLE" selected>AVAILABLE — Ready for Rent</option>
                        </select>
                    </th:block>

                    <!-- Edit Mode: Full status options -->
                    <th:block th:if="${vehicle.vehicleId != null}">
                        <select th:field="*{status}" id="status" class="form-select">
                            <option value="AVAILABLE">AVAILABLE — Ready for Rent</option>
                            <option value="BOOKED">BOOKED — Currently on Trip</option>
                            <option value="MAINTENANCE">MAINTENANCE — In Workshop</option>
                            <option value="UNAVAILABLE">UNAVAILABLE — In Service</option>
                            <option value="DECOMMISSIONED">DECOMMISSIONED — Retired</option>
                        </select>
                    </th:block>
                </div>

                <!-- Field 8: Quantity (Disabled & Locked to 1, Helper Text Removed) -->
                <div class="form-group">
                    <label class="form-label" for="quantity">Quantity</label>
                    <input type="number" id="quantity" class="form-control" value="1" readonly disabled style="background-color: var(--slate-100); cursor: not-allowed; font-weight: 600; color: var(--slate-700);">
                    <input type="hidden" name="quantity" value="1">
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Vehicle</button>
                <a th:href="@{/vehicles}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
