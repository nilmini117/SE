<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Promotion Details')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('promotions')}"></nav>

<main class="df-main">
    <div style="max-width: 680px; margin: 0 auto 1.5rem;">
        <a th:href="@{/promotions}" class="btn btn-secondary btn-sm">
            &larr; Back to Promotions
        </a>
    </div>

    <div class="df-form-card">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;"
            th:text="${promotion.promotionId} != null ? 'Edit Promotion #' + ${promotion.promotionId} : 'Create New Promotion'">
            New Promotion
        </h2>
        <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 2rem;">
            Specify campaign title, discount percentage, validity period, and live status.
        </p>

        <form th:action="${promotion.promotionId} != null ? @{/promotions/{id}(id=${promotion.promotionId})} : @{/promotions}"
              th:object="${promotion}" method="post">

            <div class="form-group">
                <label class="form-label">Promotion / Campaign Title</label>
                <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Weekend Getaway 20% Off" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Discount Percentage (%)</label>
                    <input type="number" step="0.01" th:field="*{discountRate}" class="form-control" placeholder="e.g. 15.00" min="0" max="100" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Campaign Status</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="ACTIVE">ACTIVE — Currently Offered</option>
                        <option value="EXPIRED">EXPIRED — Past Campaign</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Start Date</label>
                    <input type="date" th:field="*{startDate}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">End Date</label>
                    <input type="date" th:field="*{endDate}" class="form-control" required>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Promotion</button>
                <a th:href="@{/promotions}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
