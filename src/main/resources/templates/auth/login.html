<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('login')}"></nav>

<main class="df-main" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 180px); padding: 2rem 1rem;">
    <div style="width: 100%; max-width: 460px;">

        <!-- Info / Booking Required Alert -->
        <div th:if="${infoMessage}" 
             style="background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 0.9rem 1.25rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; display: flex; align-items: flex-start; gap: 0.75rem; font-size: 0.9rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <div>
                <strong style="display: block; margin-bottom: 2px;">Customer Registration Required</strong>
                <span th:text="${infoMessage}">Please sign in or register to book.</span>
            </div>
        </div>

        <!-- Success Alert -->
        <div th:if="${successMessage}" 
             style="background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 0.9rem 1.25rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span th:text="${successMessage}">Success message</span>
        </div>

        <!-- Error Alert -->
        <div th:if="${errorMessage}" 
             style="background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 0.9rem 1.25rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${errorMessage}">Invalid credentials</span>
        </div>

        <!-- Login Card -->
        <div class="df-form-card" style="box-shadow: var(--shadow-lg); border: 1px solid var(--slate-200); padding: 2.25rem;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 52px; height: 52px; margin: 0 auto 1rem; border-radius: 14px; background: linear-gradient(135deg, var(--primary) 0%, #312e81 100%); display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: var(--shadow-glow);">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                </div>
                <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--slate-900); margin-bottom: 0.35rem;">Welcome to DriveFlow</h1>
                <p style="color: var(--slate-500); font-size: 0.9rem;">Sign in as Customer or Staff to continue</p>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                        <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
                    </div>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; font-size: 1rem; font-weight: 600;">
                    Sign In &rarr;
                </button>
            </form>

            <!-- Quick Demo Fill Helpers -->
            <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px dashed var(--slate-200);">
                <div style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate-400); margin-bottom: 0.75rem; text-align: center;">
                    Quick Demo Logins
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem;">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('staff@driveflow.com', 'Staff123!')" style="justify-content: center; font-size: 0.82rem;">
                        Staff Demo
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemo('customer@driveflow.com', 'Customer123!')" style="justify-content: center; font-size: 0.82rem;">
                        Customer Demo
                    </button>
                </div>
            </div>

            <!-- Registration Footer -->
            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--slate-500);">
                Don't have an account? 
                <a th:href="@{/register}" style="color: var(--primary); font-weight: 600; text-decoration: none;">
                    Register as Customer &rarr;
                </a>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
function fillDemo(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
}
</script>

</body>
</html>
