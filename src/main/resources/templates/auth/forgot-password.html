<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password - DriveFlow')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('login')}"></nav>

<main class="df-main" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div style="width: 100%; max-width: 480px;">

        <!-- Back to Login Link -->
        <div style="margin-bottom: 1.25rem;">
            <a th:href="@{/login}" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                &larr; Back to Sign In
            </a>
        </div>

        <!-- Alert messages -->
        <div th:if="${errorMessage}" style="background: rgba(239, 68, 68, 0.12); border: 1px solid var(--danger); color: #991b1b; padding: 0.85rem 1.25rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.9rem;">
            ⚠️ <span th:text="${errorMessage}">Error message</span>
        </div>
        <div th:if="${successMessage}" style="background: #ecfdf5; border: 1px solid #10b981; color: #065f46; padding: 0.85rem 1.25rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.9rem;">
            ✅ <span th:text="${successMessage}">Success message</span>
        </div>

        <div class="df-form-card" style="box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border-radius: 12px;">
            <div style="text-align: center; margin-bottom: 1.75rem;">
                <div style="width: 52px; height: 52px; border-radius: 12px; background: #fee2e2; color: #b91c1c; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 0.75rem;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--slate-900); margin-bottom: 0.35rem;">Reset Your Password</h1>
                <p style="color: var(--slate-500); font-size: 0.88rem;">Secure 2-Step OTP Verification</p>
            </div>

            <!-- Step 1: Request OTP -->
            <form th:if="${step != 'verify'}" th:action="@{/forgot-password/send-otp}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label class="form-label" for="email">Enter Registered Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                    <small style="color: var(--slate-500); font-size: 0.8rem; margin-top: 0.25rem; display: block;">
                        A 6-digit verification code will be dispatched to this inbox.
                    </small>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem;">
                    📧 Send 6-Digit OTP Code &rarr;
                </button>
            </form>

            <!-- Step 2: Enter OTP & New Password -->
            <form th:if="${step == 'verify'}" th:action="@{/forgot-password/reset}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="email" th:value="${email}" />

                <div style="background: #f1f5f9; padding: 0.75rem; border-radius: 6px; margin-bottom: 1.25rem; font-size: 0.85rem; color: #334155;">
                    Resetting password for: <strong th:text="${email}">user@example.com</strong>
                </div>

                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label class="form-label">6-Digit Verification Code (OTP) <span style="color: var(--danger);">*</span></label>
                    <input type="text" name="otp" maxlength="6" pattern="^[0-9]{6}$" class="form-control" placeholder="e.g. 123456" style="letter-spacing: 4px; font-weight: 700; font-size: 1.1rem; max-width: 200px;" required autofocus>
                    <small style="color: var(--slate-500); font-size: 0.8rem; margin-top: 0.25rem; display: block;">
                        Valid for 10 minutes.
                    </small>
                </div>

                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label class="form-label">New Password (min 6 characters) <span style="color: var(--danger);">*</span></label>
                    <input type="password" name="newPassword" minlength="6" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label">Confirm New Password <span style="color: var(--danger);">*</span></label>
                    <input type="password" name="confirmPassword" minlength="6" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem;">
                    Confirm & Update Password &rarr;
                </button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
