<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Profile')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('profile')}"></nav>

<main class="df-main">
    <div style="max-width: 680px; margin: 0 auto 1.5rem;">
        <a th:href="@{/profile}" class="btn btn-secondary btn-sm">
            &larr; Back to Profile
        </a>
    </div>

    <!-- Error Alert -->
    <div th:if="${errorMessage}" style="max-width: 680px; margin: 0 auto 1.5rem; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #991b1b; padding: 1rem 1.25rem; border-radius: 8px; font-weight: 600;">
        <span th:text="${errorMessage}">Error message</span>
    </div>

    <div class="df-form-card">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;">
            Edit Customer Profile
        </h2>
        <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 2rem;">
            Update your personal contact information and driving credentials.
        </p>

        <form th:action="@{/profile/edit}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">First Name <span style="color: var(--danger);">*</span></label>
                    <input type="text" name="firstName" th:value="${customer.firstName}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Last Name <span style="color: var(--danger);">*</span></label>
                    <input type="text" name="lastName" th:value="${customer.lastName}" class="form-control" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Email Address (Read-only)</label>
                    <input type="email" th:value="${customer.email}" class="form-control" readonly
                           style="background: var(--slate-100); color: var(--slate-500); cursor: not-allowed;">
                </div>
                <div class="form-group">
                    <label class="form-label">National Identity Card (Read-only)</label>
                    <input type="text" th:value="${customer.nic}" class="form-control" readonly
                           style="background: var(--slate-100); color: var(--slate-500); cursor: not-allowed;">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Primary Contact Number <span style="color: var(--danger);">*</span></label>
                    <input type="tel" name="contactNumber" id="primaryContactNumber" th:value="${customer.contactNumber}" class="form-control" placeholder="0771234567" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Driving License Number <span style="color: var(--danger);">*</span></label>
                    <input type="text" name="drivingLicense" th:value="${customer.drivingLicense}" class="form-control" placeholder="e.g. B123456" maxlength="7" required>
                </div>
            </div>

            <!-- Additional Contact Numbers (user_contact_number Table) -->
            <div style="background: #f8fafc; border: 1px solid var(--slate-200); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                    <div>
                        <strong style="color: var(--slate-800); font-size: 0.95rem;">Additional Contact Numbers</strong>
                        <p style="color: var(--slate-500); font-size: 0.8rem; margin: 0;">Multi-phone support linked to your account profile (user_contact_number).</p>
                    </div>
                    <button type="button" id="addPhoneBtn" class="btn btn-secondary btn-sm" onclick="addPhoneNumberRow()" style="display: inline-flex; align-items: center; gap: 0.35rem;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Add Another Phone Number
                    </button>
                </div>

                <div id="phoneNumbersContainer" style="display: flex; flex-direction: column; gap: 0.6rem;">
                    <div th:each="num, stat : ${customer.contactNumbers}" th:if="${num != customer.contactNumber}" class="phone-row" style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="tel" name="contactNumbers" th:value="${num}" class="form-control" placeholder="e.g. 0112999888" style="flex: 1;">
                        <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()" style="padding: 0.45rem 0.75rem;">Remove</button>
                    </div>
                </div>
            </div>

            <script>
                function addPhoneNumberRow() {
                    const container = document.getElementById('phoneNumbersContainer');
                    const div = document.createElement('div');
                    div.className = 'phone-row';
                    div.style.cssText = 'display: flex; gap: 0.5rem; align-items: center; margin-top: 0.4rem;';
                    div.innerHTML = `
                        <input type="tel" name="contactNumbers" class="form-control" placeholder="e.g. 0719876543" style="flex: 1;" required>
                        <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()" style="padding: 0.45rem 0.75rem;">Remove</button>
                    `;
                    container.appendChild(div);
                }
            </script>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Profile Changes</button>
                <a th:href="@{/profile}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
