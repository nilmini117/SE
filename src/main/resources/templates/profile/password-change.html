<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change Password')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('profile')}"></nav>

<main class="df-main">
    <div style="max-width: 680px; margin: 0 auto 1.5rem;">
        <a th:href="@{/profile}" class="btn btn-secondary btn-sm">
            &larr; Back to Profile
        </a>
    </div>

    <!-- Error Alert -->
    <div th:if="${errorMessage}" style="max-width: 680px; margin: 0 auto 1.5rem; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: #991b1b; padding: 1rem 1.25rem; border-radius: 8px; font-weight: 600;">
        <span th:text="${errorMessage}">Error message</span>
    </div>

    <div class="df-form-card">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;">
            Security & Password
        </h2>
        <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 2rem;">
            Keep your DriveFlow account secure. Enter your current password followed by your new password.
        </p>

        <form th:action="@{/profile/password}" method="post">
            <div class="form-group">
                <label class="form-label">Current Password <span style="color: var(--danger);">*</span></label>
                <input type="password" name="oldPassword" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">New Password <span style="color: var(--danger);">*</span></label>
                    <input type="password" name="newPassword" minlength="6" class="form-control" placeholder="••••••••" required>
                    <small style="color: var(--slate-500); font-size: 0.8rem; margin-top: 0.25rem; display: block;">
                        Minimum 6 characters.
                    </small>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm New Password <span style="color: var(--danger);">*</span></label>
                    <input type="password" name="confirmPassword" minlength="6" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Update Account Password</button>
                <a th:href="@{/profile}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
