<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} != null ? ${title} + ' — DriveFlow' : 'DriveFlow — Car Rental Platform'">DriveFlow</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="navbar(activeTab)" class="df-navbar">
    <div class="df-nav-container">
        <a th:href="@{/}" class="df-brand">
            <div class="df-brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path>
                    <circle cx="7" cy="17" r="2"></circle>
                    <path d="M9 17h6"></path>
                    <circle cx="17" cy="17" r="2"></circle>
                </svg>
            </div>
            DriveFlow
        </a>
        <ul class="df-nav-menu">
            <li>
                <a th:href="@{/}" th:classappend="${activeTab == 'home'} ? 'active' : ''" class="df-nav-link">
                    Dashboard
                </a>
            </li>
            <li>
                <a th:href="@{/bookings}" th:classappend="${activeTab == 'bookings'} ? 'active' : ''" class="df-nav-link">
                    Bookings
                </a>
            </li>
            <li>
                <a th:href="@{/vehicles}" th:classappend="${activeTab == 'vehicles'} ? 'active' : ''" class="df-nav-link">
                    Vehicles
                </a>
            </li>
            <li>
                <a th:href="@{/incidents}" th:classappend="${activeTab == 'incidents'} ? 'active' : ''" class="df-nav-link">
                    Incidents
                </a>
            </li>
            <li>
                <a th:href="@{/promotions}" th:classappend="${activeTab == 'promotions'} ? 'active' : ''" class="df-nav-link">
                    Promotions
                </a>
            </li>
            <li>
                <a th:href="@{/maintenance}" th:classappend="${activeTab == 'maintenance'} ? 'active' : ''" class="df-nav-link">
                    Maintenance
                </a>
            </li>
            <li>
                <a th:href="@{/payments}" th:classappend="${activeTab == 'payments'} ? 'active' : ''" class="df-nav-link">
                    Payments
                </a>
            </li>
            <li>
                <a th:href="@{/feedback}" th:classappend="${activeTab == 'feedback'} ? 'active' : ''" class="df-nav-link">
                    Feedback
                </a>
            </li>
        </ul>
        <div class="df-nav-status">
            <span class="df-status-dot"></span>
            System Live
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="df-footer">
    <div class="df-footer-container">
        <div>&copy; 2026 DriveFlow Car Rental Management System. All rights reserved.</div>
        <div>Connected to SQL Server &bull; Sandbox Environment</div>
    </div>
</footer>

</body>
</html>
