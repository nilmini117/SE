<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${record.maintenanceId != null} ? 'Edit Schedule' : 'Schedule Service')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('maintenance')}"></nav>

<main class="df-main">
    <div style="max-width: 680px; margin: 0 auto 1.5rem;">
        <a th:href="@{/maintenance}" class="btn btn-secondary btn-sm">
            &larr; Back to Schedules
        </a>
    </div>

    <div class="df-form-card">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;"
            th:text="${record.maintenanceId != null} ? 'Edit Fleet Maintenance' : 'Schedule Fleet Maintenance'">
            Schedule Fleet Maintenance
        </h2>
        <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 2rem;">
            Assign maintenance to a fleet vehicle, record scheduled workshop date, and estimated cost.
        </p>

        <form th:action="${record.maintenanceId != null} ? @{/maintenance/{id}(id=${record.maintenanceId})} : @{/maintenance}"
              th:object="${record}" method="post">

            <div class="form-group">
                <label class="form-label">Fleet Vehicle <span style="color: var(--danger);">*</span></label>
                <select name="vehicleId" class="form-control" required>
                    <option value="" disabled th:selected="${record.vehicle == null}">-- Select Vehicle --</option>
                    <option th:each="v : ${vehicles}"
                            th:value="${v.vehicleId}"
                            th:text="${v.model} + ' (' + ${v.regNo} + ')'"
                            th:selected="${record.vehicle != null and record.vehicle.vehicleId == v.vehicleId}">
                    </option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Scheduled Service Date</label>
                    <input type="date" th:field="*{serviceDate}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Estimated Service Cost ($ USD)</label>
                    <input type="number" step="0.01" th:field="*{cost}" class="form-control" placeholder="0.00" min="0" required>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;"
                        th:text="${record.maintenanceId != null} ? 'Update Schedule' : 'Confirm Schedule'">
                    Confirm Schedule
                </button>
                <a th:href="@{/maintenance}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
