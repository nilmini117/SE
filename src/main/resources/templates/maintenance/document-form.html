<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register Document')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('maintenance')}"></nav>

<main class="df-main">
    <div style="max-width: 680px; margin: 0 auto 1.5rem;">
        <a th:href="@{/maintenance/documents}" class="btn btn-secondary btn-sm">
            &larr; Back to Documents
        </a>
    </div>

    <div class="df-form-card">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;">
            Record Vehicle Document
        </h2>
        <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 2rem;">
            Register insurance policies, road worthiness certificates, or rental operating licenses.
        </p>

        <form th:action="@{/maintenance/documents}" th:object="${document}" method="post">
            <div class="form-group">
                <label class="form-label">Document Title / Type</label>
                <input type="text" th:field="*{docType}" class="form-control" placeholder="e.g. Comprehensive Commercial Insurance" required>
            </div>

            <div class="form-group">
                <label class="form-label">Document Expiration Date</label>
                <input type="date" th:field="*{expiryDate}" class="form-control" required>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Document</button>
                <a th:href="@{/maintenance/documents}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
