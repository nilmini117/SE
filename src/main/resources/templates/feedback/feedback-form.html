<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${feedback.feedbackId != null} ? 'Edit Feedback' : 'Submit Feedback')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('feedback')}"></nav>

<main class="df-main">
    <div style="max-width: 680px; margin: 0 auto 1.5rem;">
        <a th:href="@{/feedback}" class="btn btn-secondary btn-sm">
            &larr; Back to Feedback
        </a>
    </div>

    <div class="df-form-card">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;"
            th:text="${feedback.feedbackId != null} ? 'Edit Feedback Ticket' : 'Submit Customer Feedback'">
            Submit Customer Feedback
        </h2>
        <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 2rem;">
            Record customer comments, rental inquiries, or service complaints for review.
        </p>

        <form th:action="${feedback.feedbackId != null} ? @{/feedback/{id}(id=${feedback.feedbackId})} : @{/feedback}"
              th:object="${feedback}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Submission Date</label>
                    <input type="date" th:field="*{date}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select th:field="*{category}" class="form-select">
                        <option value="SERVICE">SERVICE — General Customer Service</option>
                        <option value="VEHICLE">VEHICLE — Vehicle Quality & Performance</option>
                        <option value="PRICING">PRICING — Billing & Pricing</option>
                        <option value="STAFF">STAFF — Counter Staff & Interaction</option>
                    </select>
                </div>
            </div>

            <div class="form-group" th:if="${feedback.feedbackId != null}">
                <label class="form-label">Status</label>
                <select th:field="*{status}" class="form-select">
                    <option value="OPEN">OPEN</option>
                    <option value="RESOLVED">RESOLVED</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Message / Details</label>
                <textarea th:field="*{message}" class="form-control" rows="5" placeholder="Enter full feedback message or details of the customer interaction..." required></textarea>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;"
                        th:text="${feedback.feedbackId != null} ? 'Update Feedback' : 'Submit Feedback'">
                    Submit Feedback
                </button>
                <a th:href="@{/feedback}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
