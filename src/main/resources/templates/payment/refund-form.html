<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Issue Refund')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('payments')}"></nav>

<main class="df-main">
    <div style="max-width: 680px; margin: 0 auto 1.5rem;">
        <a th:href="@{/payments}" class="btn btn-secondary btn-sm">
            &larr; Back to Payments
        </a>
    </div>

    <div class="df-form-card">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;">
            Issue Payment Refund
        </h2>
        <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 2rem;">
            Submit a refund request for transaction <strong th:text="${payment.refNo}">TXN-123</strong>. Requests require staff review and approval.
        </p>

        <div style="background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <span style="color: var(--slate-600); font-size: 0.9rem;">Payment Reference:</span>
                <strong th:text="${payment.refNo}">TXN-001</strong>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <span style="color: var(--slate-600); font-size: 0.9rem;">Payment Date:</span>
                <span th:text="${payment.paymentDate}">2026-09-15</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span style="color: var(--slate-600); font-size: 0.9rem;">Original Amount Paid:</span>
                <strong style="color: var(--success);" th:text="'$' + ${#numbers.formatDecimal(payment.amountPaid != null ? payment.amountPaid : 0, 1, 2)}">$0.00</strong>
            </div>
        </div>

        <form th:action="@{/payments/{id}/refund(id=${payment.paymentId})}" method="post">
            <div class="form-group">
                <label class="form-label">Refund Amount ($ USD) <span style="color: var(--danger);">*</span></label>
                <input type="number" step="0.01" name="amount" th:value="${refund.amount}"
                       th:max="${payment.amountPaid}" min="0.01" class="form-control" placeholder="0.00" required>
                <small style="color: var(--slate-500); font-size: 0.8rem; margin-top: 0.25rem; display: block;">
                    Maximum allowable refund: $<span th:text="${payment.amountPaid}">0.00</span>
                </small>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Submit Refund Request</button>
                <a th:href="@{/payments}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
