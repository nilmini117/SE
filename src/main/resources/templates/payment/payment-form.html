<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${payment.paymentId != null} ? 'Edit Payment' : 'Process Payment')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('payments')}"></nav>

<main class="df-main">
    <div style="max-width: 680px; margin: 0 auto 1.5rem;">
        <a th:href="@{/payments}" class="btn btn-secondary btn-sm">
            &larr; Back to Payments
        </a>
    </div>

    <div class="df-form-card">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;"
            th:text="${payment.paymentId != null} ? 'Edit Payment Record' : 'Process Payment'">
            Process Payment
        </h2>
        <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 2rem;">
            Link settlement payment to an invoice, record payment method details, and verify transaction amount.
        </p>

        <form th:action="${payment.paymentId != null} ? @{/payments/{id}(id=${payment.paymentId})} : @{/payments}"
              th:object="${payment}" method="post">

            <div class="form-group">
                <label class="form-label">Associated Rental Invoice <span style="color: var(--danger);">*</span></label>
                <select name="invoiceId" class="form-control" required>
                    <option value="" disabled th:selected="${payment.invoice == null}">-- Select Invoice --</option>
                    <option th:each="inv : ${invoices}"
                            th:value="${inv.invoiceId}"
                            th:text="'Invoice #' + ${inv.invoiceId} + ' (Total: $' + ${inv.totalAmt} + ', Status: ' + ${inv.status} + ') - ' + (${inv.booking != null and inv.booking.customer != null ? inv.booking.customer.name : 'Unknown'})"
                            th:selected="${payment.invoice != null and payment.invoice.invoiceId == inv.invoiceId}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Payment Method</label>
                <select name="paymentMethod" id="paymentMethod" class="form-control" onchange="toggleCardFields()">
                    <option value="CASH">Cash / Bank Transfer</option>
                    <option value="CREDIT_CARD">Credit / Debit Card</option>
                </select>
            </div>

            <div id="cardFields" style="display: none; background: var(--slate-50); border: 1px solid var(--slate-200); border-radius: 8px; padding: 1rem; margin-bottom: 1rem;">
                <div class="form-group">
                    <label class="form-label">Bank Name</label>
                    <input type="text" name="bankName" class="form-control" placeholder="e.g. Chase, Bank of America">
                </div>
                <div class="form-group">
                    <label class="form-label">Card Number (Will be masked)</label>
                    <input type="text" name="cardNo" class="form-control" placeholder="4532XXXXXXXX1234" maxlength="19">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Transaction Reference Number</label>
                <input type="text" th:field="*{refNo}" class="form-control" placeholder="e.g. TXN-940219" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Payment Date</label>
                    <input type="date" th:field="*{paymentDate}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Amount Paid ($ USD)</label>
                    <input type="number" step="0.01" th:field="*{amountPaid}" class="form-control" placeholder="0.00" min="0" required>
                </div>
            </div>

            <div class="form-group" th:if="${payment.paymentId != null}">
                <label class="form-label">Payment Status</label>
                <select th:field="*{status}" class="form-control">
                    <option value="COMPLETED">COMPLETED</option>
                    <option value="CANCELLED">CANCELLED</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;"
                        th:text="${payment.paymentId != null} ? 'Update Payment' : 'Confirm & Save Payment'">
                    Confirm & Save Payment
                </button>
                <a th:href="@{/payments}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    function toggleCardFields() {
        const method = document.getElementById('paymentMethod').value;
        const cardFields = document.getElementById('cardFields');
        cardFields.style.display = method === 'CREDIT_CARD' ? 'block' : 'none';
    }
</script>

</body>
</html>
